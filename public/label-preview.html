<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Avery 5658 label preview — Class Library</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 1.5rem;
        background: #f0f0f0;
        color: #1b4332;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p.meta {
        margin: 0 0 1.5rem;
        color: #52796f;
        font-size: 0.9rem;
        max-width: 40rem;
        line-height: 1.45;
      }
      p.meta a {
        color: #1b4332;
        font-weight: 600;
      }
      .label-print-pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .label-print-page {
        width: 8.5in;
        height: 11in;
        background: white;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      }
      .label-print-area {
        width: 100%;
        height: 100%;
        padding: 0.625in;
        display: grid;
        grid-template-columns: repeat(6, 1in);
        column-gap: 0.25in;
        grid-auto-rows: 1in;
        row-gap: 0.25in;
      }
      .label-sticker {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 1px;
        overflow: hidden;
        width: 1in;
        height: 1in;
        outline: 1px dashed #ccc;
      }
      .label-qr {
        width: 0.8in;
        height: 0.8in;
        min-width: 0.8in;
        min-height: 0.8in;
        flex-shrink: 0;
      }
      .label-barcode {
        font-size: 6px;
        font-family: monospace;
        font-weight: 600;
        line-height: 1;
        text-align: center;
        letter-spacing: -0.02em;
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
      }
      @media print {
        @page {
          size: letter;
          margin: 0;
        }
        body {
          background: white;
          padding: 0;
        }
        .no-print {
          display: none;
        }
        .label-print-page {
          box-shadow: none;
          page-break-after: always;
        }
        .label-sticker {
          outline: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="no-print">
      <h1>Avery 5658 label preview</h1>
      <p class="meta">
        Stacked layout: <strong>0.8″ QR</strong> with <strong>LIB- id below</strong> on
        <strong>1″ × 1″</strong>
        <a href="https://www.avery.com/products/labels/5658" target="_blank" rel="noopener noreferrer"
          >Avery 5658</a
        >
        squares (48 per sheet). Print at 100% scale. Sample shows 12 label positions.
      </p>
    </div>
    <div class="label-print-pages">
      <div class="label-print-page">
        <div class="label-print-area" id="labels"></div>
      </div>
    </div>
    <script type="module">
      import QRCode from 'https://esm.sh/qrcode@1.5.4';

      const books = [
        { title: "Charlotte's Web", author: 'E.B. White', barcode: 'LIB-000001' },
        { title: "Charlotte's Web", author: 'E.B. White', barcode: 'LIB-000002' },
        { title: "Charlotte's Web", author: 'E.B. White', barcode: 'LIB-000003' },
        { title: 'The Very Hungry Caterpillar', author: 'Eric Carle', barcode: 'LIB-000004' },
        { title: 'Where the Wild Things Are', author: 'Maurice Sendak', barcode: 'LIB-000005' },
        { title: 'Goodnight Moon', author: 'Margaret Wise Brown', barcode: 'LIB-000006' },
        { title: 'Diary of a Wimpy Kid', author: 'Jeff Kinney', barcode: 'LIB-000007' },
        { title: 'Wonder', author: 'R.J. Palacio', barcode: 'LIB-000008' },
        { title: 'The One and Only Ivan', author: 'Katherine Applegate', barcode: 'LIB-000009' },
        { title: 'Hatchet', author: 'Gary Paulsen', barcode: 'LIB-000010' },
        { title: 'Holes', author: 'Louis Sachar', barcode: 'LIB-000011' },
        { title: 'Matilda', author: 'Roald Dahl', barcode: 'LIB-000012' },
      ];

      const root = document.getElementById('labels');
      for (const book of books) {
        const qr = await QRCode.toDataURL(book.barcode, { margin: 1, width: 240 });
        const el = document.createElement('div');
        el.className = 'label-sticker';
        el.innerHTML = `
          <img class="label-qr" src="${qr}" alt="" />
          <div class="label-barcode">${book.barcode}</div>`;
        root.appendChild(el);
      }
    </script>
  </body>
</html>
